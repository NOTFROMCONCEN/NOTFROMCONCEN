<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">NOTFROMCONCEN profile banner</title>
  <desc id="desc">A midnight blue banner with violet and cyan network lines and the words NOTFROMCONCEN, network, automation, open source.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0a1028"/>
      <stop offset=".55" stop-color="#17143d"/>
      <stop offset="1" stop-color="#0a2a38"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#b7a7ff"/>
      <stop offset=".5" stop-color="#76c9f5"/>
      <stop offset="1" stop-color="#71ebd1"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7f71ef" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7f71ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#b4c4ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="90" r="190" fill="url(#glow)"/>
  <circle cx="770" cy="310" r="120" fill="#1f9bb0" opacity=".14" filter="url(#blur)"/>
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M745 253 810 190 887 226 951 131 1030 166 1115 94" opacity=".58" stroke-width="2"/>
    <path d="M781 93 850 130 951 131 1079 264 1150 220" opacity=".35" stroke-width="2"/>
    <path d="M810 190 850 130M887 226 1079 264M1030 166 1150 220" opacity=".3" stroke-width="1.5"/>
    <path d="M720 292h425" opacity=".28" stroke-dasharray="4 9"/>
  </g>
  <g fill="#91e8e1">
    <circle cx="810" cy="190" r="5"/><circle cx="951" cy="131" r="6"/><circle cx="1030" cy="166" r="5"/>
    <circle cx="1115" cy="94" r="5"/><circle cx="887" cy="226" r="4"/><circle cx="1079" cy="264" r="4"/>
  </g>
  <g fill="#c7b8ff">
    <circle cx="745" cy="253" r="4"/><circle cx="781" cy="93" r="4"/><circle cx="850" cy="130" r="4"/>
    <circle cx="1150" cy="220" r="4"/>
  </g>
  <rect x="58" y="53" width="153" height="30" rx="15" fill="#ffffff" fill-opacity=".09" stroke="#a6b8ff" stroke-opacity=".38"/>
  <text x="76" y="73" fill="#c7d6ff" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">HELLO, I'M</text>
  <text x="56" y="157" fill="#ffffff" font-family="Arial, sans-serif" font-size="57" font-weight="800" letter-spacing="2">NOTFROMCONCEN</text>
  <rect x="58" y="180" width="540" height="4" rx="2" fill="url(#accent)"/>
  <text x="59" y="230" fill="#c7d6ef" font-family="Arial, sans-serif" font-size="21" letter-spacing="3">NETWORK  /  AUTOMATION  /  OPEN SOURCE</text>
  <text x="59" y="283" fill="#a9b8d5" font-family="Arial, sans-serif" font-size="16" letter-spacing="1">BUILD THINGS THAT WORK.</text>
</svg>
